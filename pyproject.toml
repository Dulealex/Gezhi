[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"

[project]
name = "gezhi"
version = "0.1.0"
description = "Windows-native literature and governed-knowledge workflow"
requires-python = "==3.11.*"
dependencies = [
    "feedparser",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "pypdf",
    "rapidfuzz",
    "rich",
    "tenacity",
    "typer",
]

[project.scripts]
gezhi = "gezhi.bootstrap:main"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    "ruff",
]

[tool.uv]
package = true
