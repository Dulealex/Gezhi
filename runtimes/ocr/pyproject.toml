[project]
name = "gezhi-ocr-runtime"
version = "0.1.0"
description = "Isolated MinerU pipeline runtime for Gezhi"
requires-python = "==3.11.*"
dependencies = [
    "mineru[pipeline]==3.4.4",
    "six",
    "torch==2.9.1",
    "torchvision==0.24.1",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
